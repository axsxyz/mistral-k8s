# A one-node local cluster. kind runs each Kubernetes "node" as a Docker container.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mistral
nodes:
  - role: control-plane
    # Pinned by digest, as listed in the kind v0.33.0 release notes.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # Port 30080 of the node (a NodePort Service will use it) is published on localhost:8080 of WSL.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
