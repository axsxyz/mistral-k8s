# CI: static checks on every push and pull request, then an end-to-end deployment of the CPU profile on a kind
# cluster inside the runner (no GPU on GitHub-hosted runners), finished by a real chat completion.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned tools (same script as locally)
        run: |
          bash scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Shell scripts
        run: shellcheck scripts/*.sh bench/run.sh

      - name: Helm lint (CPU, GPU and CI values)
        run: |
          helm lint charts/ministral
          helm lint charts/ministral -f charts/ministral/values-gpu.yaml
          helm lint charts/ministral -f charts/ministral/values-ci.yaml

      - name: Manifests against Kubernetes 1.37 schemas
        run: |
          for values in values.yaml values-gpu.yaml values-ci.yaml; do
            echo "== $values"
            helm template ministral charts/ministral -n mistral -f "charts/ministral/$values" \
              | kubeconform -strict -summary -kubernetes-version 1.37.0
          done
          kubeconform -strict -summary -kubernetes-version 1.37.0 k8s/manual/ bench/job.yaml

      - name: Terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Dashboard is valid JSON
        run: python3 -m json.tool observability/vllm-dashboard.json > /dev/null

  e2e:
    name: Deploy on kind and query the model (CPU profile)
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned tools
        run: |
          bash scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create the kind cluster
        run: kind create cluster --config kind/cluster.yaml --wait 120s

      - name: Terraform apply (CPU profile, CI sizing)
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan \
            -var profile=cpu -var monitoring=false \
            -var 'extra_values_files=["../charts/ministral/values-ci.yaml"]'
          terraform apply -input=false tfplan

      - name: Query the model through the Service
        run: |
          curl -sf localhost:8080/v1/models | python3 -m json.tool
          curl -sf localhost:8080/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"Reply with one word: ready"}],"max_tokens":8}' \
            | tee completion.json | python3 -m json.tool
          python3 - <<'EOF'
          import json
          answer = json.load(open("completion.json"))["choices"][0]["message"]["content"]
          assert answer.strip(), "empty completion"
          print("model answered:", answer)
          EOF

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get all,pvc -A || true
          kubectl -n mistral describe pods || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n mistral logs deploy/ministral --tail=200 || true
