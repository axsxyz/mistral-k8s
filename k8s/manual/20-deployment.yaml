# Deployment: "keep 1 pod running from this template". If the pod dies, Kubernetes creates a new one; if the template
# changes, it rolls the pod over to the new version.
# CPU profile: llama.cpp server running Mistral's official Q4_K_M GGUF of Ministral 3 3B (2.15 GB, Apache 2.0).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ministral
  namespace: mistral
  labels: { app: ministral }
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the volume is ReadWriteOnce, and two model servers at once would not fit anyway.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: ministral }
  template:
    metadata:
      labels: { app: ministral }   # the Service finds the pod through this label
    spec:
      containers:
        - name: server
          # Pinned by digest: llama.cpp no longer publishes per-build server tags (v1.0.0-b12359).
          image: ghcr.io/ggml-org/llama.cpp:server@sha256:e3032ea0712da96dec820c770626385de4322dd06619fb5829256a504bbc9375
          args:
            - -hf
            - mistralai/Ministral-3-3B-Instruct-2512-GGUF:Q4_K_M   # downloaded from Hugging Face on first start
            - --no-mmproj      # text only: skip the vision encoder
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - "4096"
            - --threads
            - "4"              # match the CPU request below, or llama.cpp would use every core of the machine
            - --temp
            - "0.1"            # the model card recommends a temperature below 0.1 for production use
          env:
            - name: LLAMA_CACHE   # where llama.cpp stores downloaded models: the persistent volume
              value: /models
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests: { cpu: "4", memory: 4Gi }   # what the scheduler reserves on the node
            limits: { memory: 6Gi }               # above this the container is killed (OOMKilled)
          # /health answers 503 while the model loads and 200 once it can serve.
          # startupProbe: allows up to 10 min (60 x 10 s) for the first download + load. Until it passes, the other
          # probes are paused, so a slow start is not mistaken for a dead server.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          # readinessProbe: while it fails, the Service sends no traffic to this pod.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          # livenessProbe: if it fails 3 times in a row, Kubernetes restarts the container.
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
