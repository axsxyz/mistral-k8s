# kube-prometheus-stack, trimmed for a one-node local cluster: Prometheus + Grafana + the operator.

alertmanager:
  enabled: false        # no alert routing in a local learning setup

prometheus:
  prometheusSpec:
    # By default Prometheus only picks up ServiceMonitors that carry this chart's release label. Ours are created by
    # another release (the model server), so select every ServiceMonitor in the cluster.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 2d
    resources:
      requests: { cpu: 200m, memory: 512Mi }

grafana:
  # Grafana refuses dashboard refresh rates below this server setting (default 5s).
  grafana.ini:
    dashboards:
      min_refresh_interval: 1s
  # Dashboards are loaded from ConfigMaps labelled grafana_dashboard=1 (Terraform creates the vLLM one).
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      # Grafana never asks Prometheus for a step smaller than the datasource's timeInterval. The chart copies
      # Prometheus's default scrape interval (30s), so panels showed one point per 30 s although vLLM is scraped
      # every 1 s.
      defaultDatasourceScrapeInterval: 1s
      alertmanager:
        enabled: false   # Alertmanager itself is disabled above
  defaultDashboardsTimezone: browser
