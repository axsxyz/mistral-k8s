# CI sizing for the CPU profile, layered last (terraform -var 'extra_values_files=["../charts/ministral/values-ci.yaml"]').
# GitHub-hosted runners have 2 to 4 vCPUs, and the kind control plane already reserves part of them: the default
# request of 4 CPUs would leave the pod Pending. Lists replace the defaults, hence the full args.

args:
  - -hf
  - mistralai/Ministral-3-3B-Instruct-2512-GGUF:Q4_K_M
  - --no-mmproj
  - --host
  - 0.0.0.0
  - --port
  - "8080"
  - --ctx-size
  - "2048"
  - --threads
  - "2"
  - --temp
  - "0.1"
  - --metrics

resources:
  requests: { cpu: "1", memory: 2Gi }
  limits: { memory: 4Gi }
