# Load test as a Kubernetes Job: `vllm bench serve` (shipped in the vLLM image already loaded on the node) runs inside
# the cluster and hits the model through its Service, at several concurrency levels.
# Each result is printed on one line prefixed with RESULT_JSON; bench/run.sh extracts them into bench/results/.
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-bench
  namespace: mistral
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: vllm/vllm-openai:v0.32.0
          imagePullPolicy: IfNotPresent
          command: [bash, -euo, pipefail, -c]
          args:
            - |
              # Fixed shape for every level: 512 prompt tokens, 256 output tokens (ignore_eos makes outputs exactly
              # 256 tokens), random prompts with a fixed seed, 4 warm-up requests excluded from the results.
              for C in 1 4 8 16 32; do
                N=$(( C * 8 )); [ "$N" -lt 32 ] && N=32
                echo "== concurrency $C, $N requests"
                vllm bench serve \
                  --backend vllm --base-url http://ministral.mistral.svc:80 \
                  --model mistralai/Ministral-3-3B-Instruct-2512 \
                  --tokenizer mistralai/Ministral-3-3B-Instruct-2512 --tokenizer-mode mistral \
                  --dataset-name random --random-input-len 512 --random-output-len 256 --random-range-ratio 0 \
                  --ignore-eos --seed 0 --num-warmups 4 \
                  --num-prompts "$N" --max-concurrency "$C" \
                  --percentile-metrics ttft,tpot,itl,e2el --metric-percentiles 50,95,99 \
                  --save-result --result-dir /tmp/results --result-filename "c$C.json"
                echo "RESULT_JSON $(tr -d '\n' < "/tmp/results/c$C.json")"
              done
          env:
            - name: HF_HOME          # the tokenizer (a few MB) is downloaded here
              value: /tmp/hf
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 4Gi }
