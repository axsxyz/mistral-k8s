# Service: a stable address in front of the pod(s) labelled app=ministral. Pods come and go with new IPs; the Service
# name (ministral.mistral.svc) and port stay the same.
# NodePort also opens port 30080 on the node, which kind/cluster.yaml publishes on localhost:8080.
apiVersion: v1
kind: Service
metadata:
  name: ministral
  namespace: mistral
spec:
  type: NodePort
  selector: { app: ministral }
  ports:
    - name: http
      port: 80            # port inside the cluster
      targetPort: http    # the container port named "http" (8080)
      nodePort: 30080
